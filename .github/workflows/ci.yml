name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go/go.sum
      # cgo + the webview binding need the GTK/WebKit headers even to compile.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev
      - run: go vet ./...
        working-directory: clients/go
      - run: go test -count=1 ./...
        working-directory: clients/go

  electron:
    name: Electron
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # No electron download: the tests are plain Node and the renderer syntax checks do
      # not need the binary, so the install is skipped entirely.
      - name: Syntax checks
        working-directory: clients/electron
        run: |
          for f in src/main/*.js src/preload.js src/renderer/app.js src/renderer/bridge.js; do
            node --check "$f"
          done
      - name: Fixture-free tests
        working-directory: clients/electron
        run: npm test
