name: Release

# Tag a commit (e.g. `git tag v0.1.0 && git push origin v0.1.0`) to build the client for
# every supported platform and attach the archives to a GitHub Release.
# Can also be run manually from the Actions tab (artifacts only, no Release).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go/go.sum
      # The webview binding needs cgo, so even the test job needs the GTK/WebKit headers.
      - name: Install Linux webview dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          # The Go binding hardcodes `pkg-config: webkit2gtk-4.0`, but Ubuntu 24.04 only
          # ships 4.1. webview.h dlopen's "libwebkit2gtk-4.1.so" first and falls back to
          # 4.0, so building against 4.1 headers is correct — pkg-config just needs to
          # answer to the 4.0 name. Prefer the real 4.0 package where it exists.
          if sudo apt-get install -y libwebkit2gtk-4.0-dev; then
          echo "Linux deps: webkit2gtk-4.0"
          else
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          mkdir -p "$HOME/pc"
          ln -sf /usr/lib/*/pkgconfig/webkit2gtk-4.1.pc "$HOME/pc/webkit2gtk-4.0.pc"
          ls -l "$HOME/pc"
          echo "PKG_CONFIG_PATH=$HOME/pc" >> "$GITHUB_ENV"
          echo "Linux deps: webkit2gtk-4.1 aliased as 4.0"
          fi
      - name: go vet
        working-directory: clients/go
        run: go vet ./...
      - name: go test
        working-directory: clients/go
        run: go test -count=1 ./...

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Go's webview binding uses cgo, so each target is built on a matching
          # runner rather than cross-compiled.
          - { os: macos-latest,    goarch: arm64, name: macos-arm64,   archive: tar.gz }
          - { os: macos-latest,    goarch: amd64, name: macos-amd64,   archive: tar.gz }
          - { os: ubuntu-latest,   goarch: amd64, name: linux-amd64,   archive: tar.gz }
          - { os: ubuntu-24.04-arm, goarch: arm64, name: linux-arm64,  archive: tar.gz }
          - { os: windows-latest,  goarch: amd64, name: windows-amd64, archive: zip }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: clients/go/go.sum

      - name: Install Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev
          # The Go binding hardcodes `pkg-config: webkit2gtk-4.0`, but Ubuntu 24.04 only
          # ships 4.1. webview.h dlopen's "libwebkit2gtk-4.1.so" first and falls back to
          # 4.0, so building against 4.1 headers is correct — pkg-config just needs to
          # answer to the 4.0 name. Prefer the real 4.0 package where it exists.
          if sudo apt-get install -y libwebkit2gtk-4.0-dev; then
          echo "Linux deps: webkit2gtk-4.0"
          else
          sudo apt-get install -y libwebkit2gtk-4.1-dev
          mkdir -p "$HOME/pc"
          ln -sf /usr/lib/*/pkgconfig/webkit2gtk-4.1.pc "$HOME/pc/webkit2gtk-4.0.pc"
          ls -l "$HOME/pc"
          echo "PKG_CONFIG_PATH=$HOME/pc" >> "$GITHUB_ENV"
          echo "Linux deps: webkit2gtk-4.1 aliased as 4.0"
          fi

      # windows-latest ships MSYS2; the webview binding needs a C/C++ compiler for cgo.
      # WebView2.h is vendored by the module (libs/mswebview2), so no SDK download.
      - name: Set up MinGW (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build
        working-directory: clients/go
        shell: bash
        env:
          CGO_ENABLED: '1'
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          ext=""
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; fi
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION:-dev}" \
            -o "dist/ibmc-kvm${ext}" .
          ./dist/ibmc-kvm${ext} --version

      - name: Package
        working-directory: clients/go
        shell: bash
        run: |
          set -euo pipefail
          # The binary looks for `web/` next to itself (or ../Resources/web in a .app),
          # so the archive must keep that layout.
          cp -R web dist/web
          cp README.md dist/README.md 2>/dev/null || true
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a -tzip "../ibmc-kvm-${{ matrix.name }}.zip" . >/dev/null
          else
            tar czf "../ibmc-kvm-${{ matrix.name }}.tar.gz" .
          fi
          cd ..
          ls -l "ibmc-kvm-${{ matrix.name }}.${{ matrix.archive }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ibmc-kvm-${{ matrix.name }}
          path: clients/go/ibmc-kvm-${{ matrix.name }}.${{ matrix.archive }}
          if-no-files-found: error

  # The Electron client bundles its own Chromium, so it is the flavour that runs
  # without a system webview. Each target is packaged on a matching runner.
  full:
    name: Package ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,     name: macos-arm64,   args: '--mac zip --arm64' }
          - { os: macos-latest,     name: macos-amd64,   args: '--mac zip --x64' }
          - { os: ubuntu-latest,    name: linux-amd64,   args: '--linux tar.gz --x64' }
          - { os: ubuntu-24.04-arm, name: linux-arm64,   args: '--linux tar.gz --arm64' }
          - { os: windows-latest,   name: windows-amd64, args: '--win zip --x64' }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Deliberately `npm install` without a committed lock file: the lock records the
      # platform-specific optional dependencies of the machine that generated it, and
      # Electron's own optional dep is the one that breaks across platforms. See the
      # note on this in clients/electron/README.md.
      - name: Install dependencies
        working-directory: clients/electron
        run: npm install --no-audit --no-fund

      - name: Package
        working-directory: clients/electron
        shell: bash
        run: |
          set -euo pipefail
          # mac.identity is "-" in package.json: the mac build is ad-hoc signed. That
          # needs no certificate, and it is what lets a downloaded .app open through
          # right-click -> Open instead of being reported as damaged.
          npx electron-builder ${{ matrix.args }} --publish never
          ls -l dist-full

      - uses: actions/upload-artifact@v4
        with:
          name: ibmc-kvm-full-${{ matrix.name }}
          # Only the archives — electron-builder also leaves an unpacked tree behind.
          path: |
            clients/electron/dist-full/*.zip
            clients/electron/dist-full/*.tar.gz
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [build, full]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: List artifacts
        run: ls -l artifacts
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(cat <<'EOF'
          Native console client for older Huawei iBMC / FusionServer BMCs. No Java.

          Two flavours are attached for every platform, both speaking the same protocol
          and sharing the same UI — pick whichever suits the machine.

          **`ibmc-kvm-<platform>` — Go client (smallest)**

          Protocol layer in Go, UI in the system webview (WKWebView / WebView2 /
          WebKitGTK). No browser engine is bundled, so the archive is about 3 MB.
          Each one contains the `ibmc-kvm` binary and the `web/` assets it needs;
          keep them in the same directory. If no system webview is available the
          client falls back to driving an installed Chromium-family browser in
          `--app` mode.

          **`ibmc-kvm-full-<platform>` — Electron build (self-contained)**

          The same UI and protocol code with Chromium bundled, for machines where no
          usable system webview exists. Expect roughly 200 MB unpacked.

          | platform | Go client | Electron build |
          |---|---|---|
          | macOS arm64 / amd64 | uses the system WKWebView; no extra runtime | ad-hoc signed `.app` in a zip — first launch needs right-click → Open, or `xattr -dr com.apple.quarantine` |
          | Windows amd64 | needs the WebView2 runtime (present on Windows 10 1803+ / 11) | unpack and run; no runtime needed |
          | Linux amd64 / arm64 | needs `libwebkit2gtk-4.1-0` at runtime | unpack and run; needs a desktop session |

          The Electron builds are ad-hoc signed on macOS and unsigned on Windows, so the
          operating system will warn about an unidentified developer on first launch.
          EOF
          )
          # This job has no checkout, so there is no .git for gh to infer the repository
          # from — pass it explicitly. Re-running for a tag that already has a release
          # uploads into the existing one instead of failing.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" artifacts/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes "$notes" \
              --verify-tag
          fi
